<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      background:#000;
    }

    iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#000;
      display:block;
    }

    /* TOP BAR */
    .topbar{
      position:absolute;
      top: env(safe-area-inset-top);
      left:0;
      right:0;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:50;
      pointer-events:none;
    }

    .pill, .btn{
      pointer-events:auto;
      background:rgba(0,0,0,0.65);
      color:#fff;
      border:1px solid rgba(255,255,255,0.25);
      border-radius:14px;
      padding:10px 14px;
      font-size:13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select:none;
    }

    .btn{
      cursor:pointer;
    }

    .btn:active{
      transform:scale(0.97);
    }

    .timer{
      font-variant-numeric: tabular-nums;
      letter-spacing:0.5px;
    }

    /* OVERLAY FINE SESSIONE */
    .overlay{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      height:100dvh;
      background:rgba(0,0,0,0.92);
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:999;
      padding:24px;
    }

    .overlay.active{
      display:flex;
    }

    .card{
      max-width:360px;
      color:#fff;
    }

    .card h1{
      font-size:22px;
      margin-bottom:12px;
    }

    .card p{
      font-size:15px;
      opacity:0.85;
      line-height:1.35;
      margin-bottom:20px;
    }

    .cta{
      display:inline-block;
      padding:12px 20px;
      border-radius:16px;
      background:#fff;
      color:#000;
      font-size:14px;
      font-weight:700;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="pill">
        Sessione <strong class="timer" id="timer">05:00</strong>
      </div>
      <button class="btn" id="exitBtn" type="button">Esci</button>
    </div>

    <!-- IFRAME AI -->
    <iframe
      id="aiFrame"
      src="https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5&lang=it"
      allow="microphone; camera; autoplay; fullscreen"
      allowfullscreen
      referrerpolicy="no-referrer"
      title="Avatar AI">
    </iframe>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay">
      <div class="card">
        <h1>Sessione scaduta</h1>
        <p>Il tempo a disposizione è terminato.</p>
        <div class="cta">Tocca per ricaricare</div>
      </div>
    </div>

  </div>

  <script>
    const SESSION_SECONDS = 5 * 60;

    const timerEl = document.getElementById("timer");
    const exitBtn = document.getElementById("exitBtn");
    const overlay = document.getElementById("overlay");
    const frame   = document.getElementById("aiFrame");

    let remaining = SESSION_SECONDS;
    let interval  = null;

    function format(sec){
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    }

    function endSession(){
      clearInterval(interval);
      frame.src = "about:blank";
      overlay.classList.add("active");
    }

    function reloadPage(){
      const url = new URL(location.href);
      url.searchParams.set("_r", Date.now());
      location.replace(url.toString());
    }

    interval = setInterval(() => {
      remaining--;
      timerEl.textContent = format(Math.max(remaining,0));
      if (remaining <= 0) endSession();
    }, 1000);

    exitBtn.addEventListener("click", () => {
      clearInterval(interval);

      // tentativo chiusura (non garantito su mobile)
      try {
        window.open("", "_self");
        window.close();
      } catch(e){}

      // fallback certo
      setTimeout(endSession, 120);
    });

    overlay.addEventListener("click", reloadPage);

    // blocchi kiosk base
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());
  </script>
</body>
</html>
