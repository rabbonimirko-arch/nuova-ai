<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Avatar AI</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    .wrap{
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh; /* iOS/Android modern */
      height: 100vh;  /* fallback */
      background: #000;
    }

    iframe{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <iframe
      src="https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5"
      allow="microphone; camera; autoplay; fullscreen"
      allowfullscreen
      playsinline
    ></iframe>
  </div>
</body>
</html>
