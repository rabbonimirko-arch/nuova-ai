<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>LiveAvatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            position: fixed;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }
        
        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
        }
        
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 177.78vh; /* 16:9 width based on height */
            height: 100vh;
            height: 100dvh;
            min-width: 100vw;
            min-height: 56.25vw; /* 9/16 = 0.5625 */
            transform: translate(-50%, -50%);
            border: none;
        }
    </style>
</head>
<body>
    <main class="stage">
        <iframe 
            src="https://embed.liveavatar.com/v1/c05eedfb-19ce-484b-8522-fc49a9de1ab3" 
            allow="microphone; camera; autoplay" 
            title="LiveAvatar">
        </iframe>
    </main>
</body>
</html>
