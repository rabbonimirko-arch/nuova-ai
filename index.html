<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    /* TOP BAR */
    .topbar {
      position: absolute;
      top: env(safe-area-inset-top);
      left: 0;
      right: 0;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }

    .badge, .btn-exit {
      pointer-events: auto;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    /* OVERLAY FINE SESSIONE */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 100;
      cursor: pointer;
      padding: 20px;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-content {
      color: #fff;
      max-width: 320px;
    }

    .overlay-content h1 {
      font-size: 22px;
      margin-bottom: 14px;
    }

    .overlay-content p {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 20px;
    }

    .overlay-content .reload {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 16px;
      background: #ffffff;
      color: #000;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="badge">
        Sessione <strong class="timer" id="timer">05:00</strong>
      </div>
      <button class="btn-exit" id="exitBtn">Esci</button>
    </div>

    <!-- IFRAME AI -->
    <iframe
      src="https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5&lang=it"
      allow="microphone; camera; autoplay; fullscreen"
      allowfullscreen
      referrerpolicy="no-referrer"
      title="Avatar AI"
    ></iframe>

    <!-- OVERLAY FINE SESSIONE -->
    <div class="overlay" id="endOverlay">
      <div class="overlay-content">
        <h1>Sessione scaduta</h1>
        <p>Il tempo a disposizione è terminato.</p>
        <div class="reload">Tocca per ricaricare</div>
      </div>
    </div>

  </div>

  <script>
    // --- CONFIG ---
    const SESSION_SECONDS = 5 * 60;

    const timerEl = document.getElementById("timer");
    const exitBtn = document.getElementById("exitBtn");
    const overlay = document.getElementById("endOverlay");

    let remaining = SESSION_SECONDS;
    let interval = null;

    function format(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function showOverlay() {
      overlay.classList.add("active");
    }

    function reloadPage() {
      const url = new URL(window.location.href);
      url.searchParams.set("_r", Date.now());
      window.location.replace(url.toString());
    }

    function startTimer() {
      timerEl.textContent = format(remaining);
      interval = setInterval(() => {
        remaining--;
        timerEl.textContent = format(remaining);
        if (remaining <= 0) {
          clearInterval(interval);
          showOverlay();
        }
      }, 1000);
    }

    // EXIT MANUALE
    exitBtn.addEventListener("click", () => {
      clearInterval(interval);
      showOverlay();
    });

    // TAP SU OVERLAY → RELOAD
    overlay.addEventListener("click", reloadPage);

    // Blocchi kiosk
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());

    // Avvio
    startTimer();
  </script>
</body>
</html>
