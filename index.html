<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Avatar AI</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Contenitore a schermo intero (9:16 su mobile) */
    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* Wrapper con aspect ratio 9:16 e massimo ingrandimento possibile */
    .frameWrap {
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (9 / 16));
      max-height: calc(100vw * (16 / 9));
      aspect-ratio: 9 / 16;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="frameWrap">
      <iframe
        src="https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5&lang=it"
        allow="microphone; camera; autoplay; clipboard-read; clipboard-write; fullscreen"
        referrerpolicy="no-referrer"
        title="Avatar AI">
      </iframe>
    </div>
  </div>
</body>
</html>
