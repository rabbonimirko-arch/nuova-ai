<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LiveAvatar</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    /* Fullscreen wrapper */
    .wrap{
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh; /* iOS/Android modern */
      height: 100vh;  /* fallback */
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Area 9:16 centrata (senza tagli su qualsiasi schermo) */
    .stage{
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      background: #000;
      position: relative;
    }

    iframe{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stage">
      <iframe
        src="https://embed.liveavatar.com/v1/66124c79-4f55-4ede-9cea-229d6f8a0767"
        allow="microphone; camera; autoplay; fullscreen"
        allowfullscreen
        playsinline
        title="LiveAvatar Embed"
      ></iframe>
    </div>
  </div>
</body>
</html>
