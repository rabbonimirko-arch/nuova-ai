<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Avatar AI</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; color:#fff; overflow:hidden; font-family:Arial, Helvetica, sans-serif; }

    .page{
      width:100vw; height:100vh;
      display:grid; place-items:center;
      background:#000;
      padding:18px;
    }

    /* cornice 9:16 */
    .card{
      width:100%;
      max-width:420px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:18px;
      background:rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      text-align:center;
    }

    .title{ font-size:18px; font-weight:800; margin-bottom:10px; }
    .sub{ font-size:14px; opacity:.85; margin-bottom:14px; line-height:1.35; }

    .btn{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px 16px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      background:#fff;
      color:#000;
    }

    .hint{
      margin-top:12px;
      font-size:12px;
      opacity:.75;
      line-height:1.35;
    }

    .small{
      margin-top:10px;
      font-size:12px;
      opacity:.7;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">Start</div>
      <div class="sub">
        Tocca Start per aprire l’avatar a schermo intero (iPhone / Android).
      </div>

      <button class="btn" id="startBtn">Start</button>

      <div class="hint">
        Se il microfono non va: controlla i permessi del browser (Safari/Chrome).
      </div>

      <div class="small" id="info"></div>
    </div>
  </div>

  <script>
    // Endpoint “mascherato” sul TUO dominio (Vercel rewrite)
    // Così l’utente apre: https://tuodominio.vercel.app/app
    const INTERNAL_PATH = "/app";

    // Se vuoi permettere override lingua: /?lang=fr
    const qs = new URLSearchParams(window.location.search);
    const lang = qs.get("lang") || "it";

    // Passiamo lang al percorso /app?lang=it (che verrà riscritto verso lia.gamaleau.it)
    const target = INTERNAL_PATH + "?lang=" + encodeURIComponent(lang);

    document.getElementById("info").textContent = "Apertura: " + target;

    document.getElementById("startBtn").addEventListener("click", () => {
      // replace evita che tornando indietro ricarichi sessioni strane
      window.location.replace(target);
    });
  </script>
</body>
</html>
