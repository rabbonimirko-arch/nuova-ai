<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Avatar AI</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }

    /* iOS/Android: usa viewport dinamica */
    .wrap{
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;   /* modern */
      height: 100vh;    /* fallback */
      background:#000;
    }

    iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    /* Overlay “tap to start” */
    .cover{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000;
      z-index:10;
    }
    .btn{
      padding:16px 22px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.10);
      color:#fff;
      font: 600 16px/1.2 Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cover" id="cover">
      <button class="btn" id="startBtn">Tocca per avviare</button>
    </div>

    <iframe
      id="frame"
      src="https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5&lang=it"
      allow="microphone; camera; autoplay; fullscreen"
      allowfullscreen
      playsinline
    ></iframe>
  </div>

  <script>
    // Su mobile spesso serve un gesto utente prima di avviare audio/mic.
    const cover = document.getElementById('cover');
    document.getElementById('startBtn').addEventListener('click', () => {
      cover.style.display = 'none';
      // forza un "repaint" e focus sull'iframe
      document.getElementById('frame').focus();
    });
  </script>
</body>
</html>
