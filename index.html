<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000" />
  <title>Avatar AI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .page{width:100vw;height:100vh;display:grid;place-items:center;padding:18px}
    .card{width:min(92%,420px);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px;text-align:center}
    .title{font-weight:800;font-size:18px;margin-bottom:10px}
    .sub{opacity:.85;font-size:14px;line-height:1.35;margin-bottom:14px}
    button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer;background:#fff;color:#000}
    .hint{margin-top:12px;font-size:12px;opacity:.75;line-height:1.35}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">Start</div>
      <div class="sub">Tocca Start per aprire l’avatar (iPhone/Android).</div>
      <button id="startBtn">Start</button>
      <div class="hint">Se il microfono non va: consenti i permessi in Safari/Chrome.</div>
    </div>
  </div>

  <script>
    const url = "https://lia.gamaleau.it/?knowledgeid=98748408-6c75-4b05-94d2-3a8c4b8c91e9&avatarid=69cf601f-b35b-4d1b-a701-c854d223b5a5&lang=it";
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = url;
    });
  </script>
</body>
</html>
